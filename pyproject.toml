[project]
name = "INFO698_LitExplore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CesarCastroMunoz", email = "cgcastro@arizona.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "arxiv>=4.0.1",
    "langchain-openai>=1.7.2",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "openai>=3.31.0",
    "pandas>=2.3.3",
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "pyalex>=0.21",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "streamlit-agraph>=0.0.45",
]

[tool.uv]
package = false

[project.scripts]
litexplore = "litexplore:main"

[project.optional-dependencies]
extraction = [
    "gliner2[local]>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
