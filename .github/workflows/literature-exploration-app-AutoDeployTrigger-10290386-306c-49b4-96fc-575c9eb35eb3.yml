name: Trigger auto deployment for literature-exploration-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/literature-exploration-app-AutoDeployTrigger-10290386-306c-49b4-96fc-575c9eb35eb3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LITERATUREEXPLORATIONAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LITERATUREEXPLORATIONAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LITERATUREEXPLORATIONAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: literatureexplorationacr.azurecr.io
          registryUsername: ${{ secrets.LITERATUREEXPLORATIONAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LITERATUREEXPLORATIONAPP_REGISTRY_PASSWORD }}
          containerAppName: literature-exploration-app
          resourceGroup: Literature_Exploration
          imageToBuild: literatureexplorationacr.azurecr.io/literature-exploration-app:${{ github.sha }}
          dockerfilePath: Dockerfile
          disableTelemetry: true
          targetPort: 8000
          _buildArgumentsKey_: |
            _buildArgumentsValues_


